name: Master Chef CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕️ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔍 Validate project structure
        run: |
          echo "Validando estructura del proyecto..."
          [ -f "pom.xml" ] && echo "✅ pom.xml encontrado" || exit 1
          [ -d "src/main/java" ] && echo "✅ código fuente encontrado" || exit 1
          echo "🎯 Estructura válida"

      - name: 🏗 Build application
        run: mvn clean compile -DskipTests

      - name: 📦 Package application
        run: mvn package -DskipTests

      - name: ✅ Verify build
        run: |
          echo "Verificando build..."
          [ -f "target/master-chef-api-0.0.1-SNAPSHOT.jar" ] && echo "✅ JAR creado exitosamente" || echo "❌ Error en build"
          echo "📊 Build completado: target/master-chef-api-0.0.1-SNAPSHOT.jar"

  deploy-notification:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    
    steps:
      - name: 🚀 Production ready
        run: |
          echo "🎉 DESPLIEGUE A PRODUCCIÓN LISTO"
          echo "========================================"
          echo "Application: master-chef-api"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "JAR: target/master-chef-api-0.0.1-SNAPSHOT.jar"
          echo "========================================"
          echo "📋 Para Azure: Configurar Web App con este JAR"